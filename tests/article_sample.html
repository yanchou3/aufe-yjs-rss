    <div class="read"><div class="wp_articlecontent"><p class="MsoNormal" style="text-indent:32px;"><span style="font-family:宋体, simsun;font-size:16px;">7月13日至15日，我校举办2026年研究生暑期学术训练营。训练营以“人工智能对经济学研究范式的重构”为主题。</span></p><p class="MsoNormal"><span style="font-size:16px;">三天课程中，名师们系统讲授了现代经济学前沿方法。</span></p><p style="text-align:center;"><img data-layer="photo" src="/_upload/article/images/ee/b5/test.png" style="width:600px;height:305px;" sudyfile-attr="{'title':'图片1.png'}" width="600" height="305" border="0"></p><p><span>（文/图：兰轲轲；审核：张超）</span></p></div></div>
